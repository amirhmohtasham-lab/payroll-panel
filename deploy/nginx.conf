# Reverse proxy for the FastAPI backend + static SPA hosting.
#
# By default this serves plain HTTP on :80. To enable TLS:
#   1. Put your certificate + key under deploy/certs/ (see deploy/certs/README.md).
#   2. Uncomment the `listen 443 ssl` server block below and the HTTP->HTTPS
#      redirect in the :80 server block.
#   3. Restart the nginx service: `docker compose up -d nginx`.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # --- Uncomment to force HTTPS once certs are in place ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location /api/ {
        proxy_pass http://web:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

